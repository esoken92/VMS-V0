[package]
name = "vms-offline-server"
description = "VMS offline backend — Axum + SQLite implementing the shared /api/v1 contract (spec items 300-303)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vms_offline_server"
path = "src/lib.rs"

[[bin]]
name = "vms-offline-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# rusqlite chosen over sqlx: synchronous API maps cleanly onto a single
# Mutex<Connection> (SQLite is single-writer anyway — WAL or not), `bundled`
# compiles SQLite from source so the artifact has zero system dependencies,
# and `Connection::transaction()` makes the "movement insert + stock update
# in ONE tx" ledger invariant trivially expressible and testable.
rusqlite = { version = "0.41", features = ["bundled"] }
# Same argon2id PHC format as the `argon2` npm package used by the web
# backend — hashes are interoperable between the two artifacts.
argon2 = "0.6"
# Pinned below the 1.29.x line: uuid 1.29.2 was released 2026-11-09
# (< 7 days old at scaffold time). Lockfile carries 1.28.0.
uuid = { version = "=1.28.0", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
